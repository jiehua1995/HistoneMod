  desc: Save complete analyses and generate manuscript-ready text.
  contents:
  - save_project
  - load_project
  - export_analysis_bundle
  - methods_text
  - statistics_table
  - figure_legend
- title: Session and utilities
  contents:
  - save_session
  - load_session
  - depends_check

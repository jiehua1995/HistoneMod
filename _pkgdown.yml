url: https://jiehua1995.github.io/HistoneMod/

template:
  bootstrap: 5

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, changelog, github]
  components:
    changelog:
      text: Changelog
      href: https://github.com/jiehua1995/HistoneMod/blob/main/CHANGELOG.md

reference:
- title: Overview
  desc: Package-level documentation.
  contents:
  - HistoneMod-package
- title: Run HistoneMod
  desc: Launch the packaged Shiny application.
  contents:
  - runHistoneMod
  - histonemod_app
- title: Read and validate data
  desc: Import Skyline exports, infer sample sheets and remap columns.
  contents:
  - read_skyline_csv
  - infer_sample_sheet
  - map_columns
  - validate_input_tables
- title: Quantify peptide states
  desc: Compute relative percentages, light/heavy ratios and spike-in normalisation.
  contents:
  - percentage_calculation
  - quantify_peptides
  - normalize_values
  - transform_composition
  - composition_matrix
- title: Analyse
  desc: Differential testing and quality control.
  contents:
  - differential_analysis
  - compute_metrics
  - qc_summary
- title: Visualise
  desc: Build publication-ready plots from processed data.
  contents:
  - plot_pca
  - plot_pca_scree
  - plot_pca_loadings
  - plot_heatmap
  - plot_barplot_single
  - plot_volcano
  - plot_effect_heatmap
  - plot_composition
  - plot_site_map
  - plot_qc_missingness
  - plot_qc_cv
  - plot_sample_correlation
  - plot_missingness_tile
  - plot_rt_consistency
- title: Plot styling
  desc: Consistent themes and colour-blind-friendly palettes.
  contents:
  - theme_histonemod
  - histonemod_palette
  - scale_colour_histonemod
  - scale_fill_histonemod
- title: Site-level analysis
  desc: Parse modification sites, estimate occupancy and analyse cross-talk.
  contents:
  - parse_peptide_sites
  - compute_site_occupancy
  - plot_occupancy
  - compute_crosstalk
  - plot_crosstalk
- title: Histone mark annotation
  desc: Map sites to canonical mark names, functional classes and enzymes.
  contents:
  - histone_marks
  - normalise_histone_protein
  - annotate_sites
  - summarise_by_class
  - plot_mark_classes
- title: Dose-response and power
  desc: Fit dose-response curves and plan replicate numbers.
  contents:
  - fit_dose_response
  - plot_dose_response
  - fit_time_course
  - plot_time_course
  - simulate_histone_data
  - estimate_power
  - plot_power_curve
- title: Batch processing and comparison
  desc: Process several Skyline exports and compare experiments.
  contents:
  - run_histonemod_batch
  - compare_experiments
  - plot_experiment_comparison
